[build]
  command = "npm run build"
  publish = "dist/rmmj-website/browser"

[build.environment]
  NODE_VERSION = "22.22.3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Permite abrir /recrutamento/ diretamente e recarregar a página Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
